<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoDev Platform - 端到端研发自动化系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1e1b4b 100%);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* 导航栏 */
        .navbar {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        /* 主容器 */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 6rem 2rem 2rem;
        }

        /* 仪表板网格 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        /* 卡片样式 */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .icon-blue { background: rgba(99, 102, 241, 0.2); }
        .icon-purple { background: rgba(139, 92, 246, 0.2); }
        .icon-green { background: rgba(16, 185, 129, 0.2); }
        .icon-orange { background: rgba(245, 158, 11, 0.2); }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* 按钮样式 */
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .btn-primary:hover {
            box-shadow: 0 5px 20px rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--border-color);
            color: var(--text-primary);
        }

        /* 表格样式 */
        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            margin-bottom: 2rem;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.9rem;
        }

        td {
            color: var(--text-primary);
        }

        tr:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        /* 状态标签 */
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success-color);
        }

        .status-running {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary-color);
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning-color);
        }

        .status-failed {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger-color);
        }

        /* 进度条 */
        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            transition: width 0.3s;
        }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            border: 1px solid var(--border-color);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--dark-bg);
            color: var(--text-primary);
            font-size: 1rem;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* 工作流可视化 */
        .workflow-steps {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .step {
            flex: 1;
            padding: 1rem;
            background: var(--dark-bg);
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .step.active {
            border-color: var(--primary-color);
            background: rgba(99, 102, 241, 0.1);
        }

        .step.completed {
            border-color: var(--success-color);
            background: rgba(16, 185, 129, 0.1);
        }

        /* Agent 列表 */
        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
        }

        .agent-card {
            background: var(--dark-bg);
            border-radius: 8px;
            padding: 1rem;
            border: 1px solid var(--border-color);
        }

        .agent-status {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 0.5rem;
        }

        .status-online { background: var(--success-color); }
        .status-busy { background: var(--warning-color); }
        .status-offline { background: var(--text-secondary); }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 动画效果 */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading {
            animation: pulse 1.5s infinite;
        }

        /* Toast 通知 */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem 1.5rem;
            display: none;
            z-index: 3000;
        }

        .toast.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">🚀 AutoDev Platform</div>
            <ul class="nav-links">
                <li><a href="#dashboard">仪表板</a></li>
                <li><a href="#projects">项目管理</a></li>
                <li><a href="#workflows">工作流</a></li>
                <li><a href="#agents">AI Agents</a></li>
                <li><a href="#tests">测试中心</a></li>
            </ul>
        </div>
    </nav>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 统计卡片 -->
        <div class="dashboard-grid">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">活跃项目</h3>
                    <div class="card-icon icon-blue">📁</div>
                </div>
                <div class="stat-value" id="active-projects">0</div>
                <div class="stat-label">正在进行中的项目</div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">运行中工作流</h3>
                    <div class="card-icon icon-purple">⚙️</div>
                </div>
                <div class="stat-value" id="running-workflows">0</div>
                <div class="stat-label">自动化任务执行中</div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">AI Agents</h3>
                    <div class="card-icon icon-green">🤖</div>
                </div>
                <div class="stat-value" id="active-agents">0</div>
                <div class="stat-label">可用的智能体</div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">代码生成</h3>
                    <div class="card-icon icon-orange">💻</div>
                </div>
                <div class="stat-value" id="generated-files">0</div>
                <div class="stat-label">已生成的文件数</div>
            </div>
        </div>

        <!-- 项目列表 -->
        <div class="table-container" id="projects">
            <div class="card-header">
                <h3 class="card-title">项目管理</h3>
                <button class="btn btn-primary" onclick="showNewProjectModal()">
                    ➕ 新建项目
                </button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>项目名称</th>
                        <th>状态</th>
                        <th>技术栈</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="projects-table-body">
                    <tr>
                        <td colspan="5" style="text-align: center; color: var(--text-secondary);">
                            暂无项目数据
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 工作流监控 -->
        <div class="table-container" id="workflows">
            <div class="card-header">
                <h3 class="card-title">工作流监控</h3>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>工作流名称</th>
                        <th>项目</th>
                        <th>状态</th>
                        <th>进度</th>
                        <th>开始时间</th>
                    </tr>
                </thead>
                <tbody id="workflows-table-body">
                    <tr>
                        <td colspan="5" style="text-align: center; color: var(--text-secondary);">
                            暂无工作流数据
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- AI Agents -->
        <div class="table-container" id="agents">
            <div class="card-header">
                <h3 class="card-title">AI Agents</h3>
            </div>
            <div class="agent-grid" id="agent-grid">
                <!-- Agent 卡片将通过 JS 动态生成 -->
            </div>
        </div>

        <!-- 测试结果 -->
        <div class="table-container" id="tests">
            <div class="card-header">
                <h3 class="card-title">最近测试结果</h3>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>测试套件</th>
                        <th>类型</th>
                        <th>状态</th>
                        <th>通过率</th>
                        <th>执行时间</th>
                    </tr>
                </thead>
                <tbody id="tests-table-body">
                    <tr>
                        <td colspan="5" style="text-align: center; color: var(--text-secondary);">
                            暂无测试数据
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 新建项目模态框 -->
    <div class="modal" id="new-project-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>创建新项目</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="new-project-form" onsubmit="createProject(event)">
                <div class="form-group">
                    <label class="form-label">项目名称 *</label>
                    <input type="text" class="form-input" id="project-name" required placeholder="输入项目名称">
                </div>
                <div class="form-group">
                    <label class="form-label">项目描述</label>
                    <textarea class="form-input" id="project-description" rows="3" placeholder="简要描述项目"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">技术栈</label>
                    <select class="form-input" id="project-tech-stack">
                        <option value="fastapi-react">FastAPI + React</option>
                        <option value="django-vue">Django + Vue</option>
                        <option value="flask-angular">Flask + Angular</option>
                        <option value="custom">自定义</option>
                    </select>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary">创建项目</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div class="toast" id="toast"></div>

    <script>
        // API 基础 URL
        const API_BASE = 'http://localhost:8000/api/v1';

        // 工具函数
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show';
            setTimeout(() => {
                toast.className = 'toast';
            }, 3000);
        }

        function showModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function closeModal() {
            document.getElementById('new-project-modal').classList.remove('active');
        }

        function showNewProjectModal() {
            showModal('new-project-modal');
        }

        // 格式化日期
        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleString('zh-CN');
        }

        // 获取状态标签 HTML
        function getStatusBadge(status) {
            const statusMap = {
                'draft': ['草稿', 'status-pending'],
                'development': ['开发中', 'status-running'],
                'testing': ['测试中', 'status-running'],
                'completed': ['已完成', 'status-success'],
                'failed': ['失败', 'status-failed'],
                'pending': ['待处理', 'status-pending'],
                'running': ['运行中', 'status-running'],
                'passed': ['通过', 'status-success'],
            };
            const [label, className] = statusMap[status] || [status, 'status-pending'];
            return `<span class="status-badge ${className}">${label}</span>`;
        }

        // 加载项目列表
        async function loadProjects() {
            try {
                const response = await fetch(`${API_BASE}/projects?page=1&page_size=10`);
                const data = await response.json();
                
                if (data.success && data.data.length > 0) {
                    const tbody = document.getElementById('projects-table-body');
                    tbody.innerHTML = data.data.map(project => `
                        <tr>
                            <td>${project.name}</td>
                            <td>${getStatusBadge(project.status)}</td>
                            <td>${project.tech_stack ? Object.keys(project.tech_stack).join(', ') : '-'}</td>
                            <td>${formatDate(project.created_at)}</td>
                            <td>
                                <button class="btn btn-secondary" style="padding: 0.5rem;" onclick="viewProject(${project.id})">查看</button>
                            </td>
                        </tr>
                    `).join('');
                    
                    document.getElementById('active-projects').textContent = data.total;
                }
            } catch (error) {
                console.error('加载项目失败:', error);
            }
        }

        // 创建工作流
        async function createProject(event) {
            event.preventDefault();
            
            const name = document.getElementById('project-name').value;
            const description = document.getElementById('project-description').value;
            const techStack = document.getElementById('project-tech-stack').value;
            
            try {
                const response = await fetch(`${API_BASE}/projects`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name,
                        description,
                        tech_stack: { stack: techStack }
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast('项目创建成功！', 'success');
                    closeModal();
                    loadProjects();
                } else {
                    showToast('创建失败：' + (data.error?.message || '未知错误'), 'error');
                }
            } catch (error) {
                showToast('网络错误：' + error.message, 'error');
            }
        }

        // 加载工作流列表
        async function loadWorkflows() {
            try {
                const response = await fetch(`${API_BASE}/workflows?page=1&page_size=10`);
                const data = await response.json();
                
                if (data.success && data.data.length > 0) {
                    const tbody = document.getElementById('workflows-table-body');
                    tbody.innerHTML = data.data.map(workflow => `
                        <tr>
                            <td>${workflow.name}</td>
                            <td>项目 #${workflow.project_id}</td>
                            <td>${getStatusBadge(workflow.status)}</td>
                            <td>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${workflow.status === 'completed' ? 100 : workflow.status === 'running' ? 50 : 0}%"></div>
                                </div>
                            </td>
                            <td>${formatDate(workflow.started_at)}</td>
                        </tr>
                    `).join('');
                    
                    const runningCount = data.data.filter(w => w.status === 'running').length;
                    document.getElementById('running-workflows').textContent = runningCount;
                }
            } catch (error) {
                console.error('加载工作流失败:', error);
            }
        }

        // 加载 Agents
        async function loadAgents() {
            try {
                const response = await fetch(`${API_BASE}/agents?page=1&page_size=20`);
                const data = await response.json();
                
                if (data.success) {
                    const agentGrid = document.getElementById('agent-grid');
                    agentGrid.innerHTML = data.data.map(agent => `
                        <div class="agent-card">
                            <div style="display: flex; align-items: center; margin-bottom: 0.5rem;">
                                <span class="agent-status ${agent.status === 'idle' ? 'status-online' : agent.status === 'busy' ? 'status-busy' : 'status-offline'}"></span>
                                <strong>${agent.name}</strong>
                            </div>
                            <div style="color: var(--text-secondary); font-size: 0.9rem;">
                                类型：${agent.type}<br>
                                任务数：${agent.total_tasks}<br>
                                成功率：${agent.total_tasks > 0 ? Math.round((agent.successful_tasks / agent.total_tasks) * 100) : 0}%
                            </div>
                        </div>
                    `).join('');
                    
                    const activeCount = data.data.filter(a => a.status !== 'offline').length;
                    document.getElementById('active-agents').textContent = activeCount;
                }
            } catch (error) {
                console.error('加载 Agents 失败:', error);
            }
        }

        // 加载测试套件
        async function loadTests() {
            try {
                const response = await fetch(`${API_BASE}/tests/suites?page=1&page_size=10`);
                const data = await response.json();
                
                if (data.success && data.data.length > 0) {
                    const tbody = document.getElementById('tests-table-body');
                    tbody.innerHTML = data.data.map(suite => {
                        const passRate = suite.total_tests > 0 
                            ? Math.round((suite.passed_tests / suite.total_tests) * 100) 
                            : 0;
                        return `
                            <tr>
                                <td>${suite.name}</td>
                                <td>${suite.type}</td>
                                <td>${getStatusBadge(suite.last_run_status || 'pending')}</td>
                                <td>${passRate}%</td>
                                <td>${formatDate(suite.last_run_at)}</td>
                            </tr>
                        `;
                    }).join('');
                }
            } catch (error) {
                console.error('加载测试失败:', error);
            }
        }

        // 查看项目详情
        function viewProject(id) {
            showToast(`查看项目 #${id}`, 'info');
            // TODO: 实现项目详情页面
        }

        // 初始化加载数据
        async function initDashboard() {
            await Promise.all([
                loadProjects(),
                loadWorkflows(),
                loadAgents(),
                loadTests()
            ]);
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initDashboard);

        // 定时刷新（每 30 秒）
        setInterval(initDashboard, 30000);
    </script>
</body>
</html>
