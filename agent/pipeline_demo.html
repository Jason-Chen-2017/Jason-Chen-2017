<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研发自动化流水线演示 - AutoDev Pipeline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #1e293b;
            --light: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        /* 流水线展示 */
        .pipeline-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .pipeline-stages {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin-bottom: 40px;
        }

        .pipeline-stages::before {
            content: '';
            position: absolute;
            top: 40px;
            left: 50px;
            right: 50px;
            height: 4px;
            background: #e2e8f0;
            z-index: 0;
        }

        .stage {
            position: relative;
            z-index: 1;
            text-align: center;
            flex: 1;
        }

        .stage-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: white;
            border: 4px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 32px;
            transition: all 0.3s;
        }

        .stage.active .stage-icon {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.4);
        }

        .stage.completed .stage-icon {
            border-color: var(--success);
            background: var(--success);
            color: white;
        }

        .stage-name {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 5px;
        }

        .stage-status {
            font-size: 12px;
            color: #64748b;
        }

        .stage.active .stage-status {
            color: var(--primary);
        }

        /* 详情面板 */
        .detail-panel {
            background: var(--light);
            border-radius: 15px;
            padding: 30px;
            margin-top: 30px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .panel-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
        }

        .control-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #4f46e5;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: white;
            color: var(--dark);
            border: 2px solid #e2e8f0;
        }

        .btn-secondary:hover {
            border-color: var(--primary);
        }

        /* 日志区域 */
        .log-area {
            background: var(--dark);
            color: #10b981;
            font-family: 'Courier New', monospace;
            padding: 20px;
            border-radius: 10px;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.6;
        }

        .log-entry {
            margin-bottom: 8px;
        }

        .log-time {
            color: #64748b;
            margin-right: 10px;
        }

        .log-info { color: #60a5fa; }
        .log-success { color: #10b981; }
        .log-warning { color: #f59e0b; }
        .log-error { color: #ef4444; }

        /* Agent 状态卡片 */
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .agent-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 2px solid #e2e8f0;
            transition: all 0.3s;
        }

        .agent-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .agent-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .agent-name {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 5px;
        }

        .agent-status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        .agent-status.working {
            background: #dbeafe;
            color: var(--primary);
        }

        .agent-status.idle {
            background: #f1f5f9;
            color: #64748b;
        }

        .agent-status.completed {
            background: #d1fae5;
            color: var(--success);
        }

        /* 进度条 */
        .progress-container {
            margin-top: 20px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: #64748b;
        }

        .progress-bar {
            height: 12px;
            background: #e2e8f0;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #8b5cf6);
            border-radius: 6px;
            transition: width 0.5s ease;
            width: 0%;
        }

        /* 动画 */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .pulse {
            animation: pulse 1.5s infinite;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide-in {
            animation: slideIn 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 研发自动化流水线演示</h1>
            <p>从需求到部署的全流程自动化</p>
        </div>

        <div class="pipeline-container">
            <!-- 流水线阶段 -->
            <div class="pipeline-stages">
                <div class="stage" id="stage-1">
                    <div class="stage-icon">📝</div>
                    <div class="stage-name">需求分析</div>
                    <div class="stage-status">等待中</div>
                </div>
                <div class="stage" id="stage-2">
                    <div class="stage-icon">📋</div>
                    <div class="stage-name">PRD 设计</div>
                    <div class="stage-status">等待中</div>
                </div>
                <div class="stage" id="stage-3">
                    <div class="stage-icon">🏗️</div>
                    <div class="stage-name">技术方案</div>
                    <div class="stage-status">等待中</div>
                </div>
                <div class="stage" id="stage-4">
                    <div class="stage-icon">🔌</div>
                    <div class="stage-name">API 设计</div>
                    <div class="stage-status">等待中</div>
                </div>
                <div class="stage" id="stage-5">
                    <div class="stage-icon">💻</div>
                    <div class="stage-name">AI Coding</div>
                    <div class="stage-status">等待中</div>
                </div>
                <div class="stage" id="stage-6">
                    <div class="stage-icon">✅</div>
                    <div class="stage-name">测试</div>
                    <div class="stage-status">等待中</div>
                </div>
                <div class="stage" id="stage-7">
                    <div class="stage-icon">🚀</div>
                    <div class="stage-name">部署</div>
                    <div class="stage-status">等待中</div>
                </div>
            </div>

            <!-- 进度条 -->
            <div class="progress-container">
                <div class="progress-label">
                    <span>整体进度</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <!-- Agent 状态 -->
            <div class="agents-grid">
                <div class="agent-card">
                    <div class="agent-icon">📝</div>
                    <div class="agent-name">产品经理 Agent</div>
                    <div class="agent-status idle" id="agent-pm">○ 空闲</div>
                </div>
                <div class="agent-card">
                    <div class="agent-icon">🏗️</div>
                    <div class="agent-name">架构师 Agent</div>
                    <div class="agent-status idle" id="agent-arch">○ 空闲</div>
                </div>
                <div class="agent-card">
                    <div class="agent-icon">💻</div>
                    <div class="agent-name">开发 Agent</div>
                    <div class="agent-status idle" id="agent-dev">○ 空闲</div>
                </div>
                <div class="agent-card">
                    <div class="agent-icon">✅</div>
                    <div class="agent-name">测试 Agent</div>
                    <div class="agent-status idle" id="agent-test">○ 空闲</div>
                </div>
                <div class="agent-card">
                    <div class="agent-icon">🚀</div>
                    <div class="agent-name">DevOps Agent</div>
                    <div class="agent-status idle" id="agent-ops">○ 空闲</div>
                </div>
            </div>

            <!-- 详情面板 -->
            <div class="detail-panel slide-in">
                <div class="panel-header">
                    <h3 class="panel-title">📊 执行日志</h3>
                    <div class="control-buttons">
                        <button class="btn btn-secondary" onclick="clearLogs()">清空日志</button>
                        <button class="btn btn-primary" onclick="startPipeline()">▶ 启动流水线</button>
                    </div>
                </div>
                <div class="log-area" id="log-area">
                    <div class="log-entry">
                        <span class="log-time">[系统]</span>
                        <span>准备就绪，点击"启动流水线"开始执行...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const stages = [
            { id: 'stage-1', name: '需求分析', agent: 'agent-pm', duration: 3000 },
            { id: 'stage-2', name: 'PRD 设计', agent: 'agent-pm', duration: 4000 },
            { id: 'stage-3', name: '技术方案', agent: 'agent-arch', duration: 4000 },
            { id: 'stage-4', name: 'API 设计', agent: 'agent-arch', duration: 3000 },
            { id: 'stage-5', name: 'AI Coding', agent: 'agent-dev', duration: 5000 },
            { id: 'stage-6', name: '测试', agent: 'agent-test', duration: 4000 },
            { id: 'stage-7', name: '部署', agent: 'agent-ops', duration: 3000 }
        ];

        let currentStage = 0;
        let isRunning = false;

        function addLog(message, type = 'info') {
            const logArea = document.getElementById('log-area');
            const time = new Date().toLocaleTimeString();
            
            const logClass = {
                'info': 'log-info',
                'success': 'log-success',
                'warning': 'log-warning',
                'error': 'log-error'
            }[type] || 'log-info';

            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `
                <span class="log-time">[${time}]</span>
                <span class="${logClass}">${message}</span>
            `;
            
            logArea.appendChild(entry);
            logArea.scrollTop = logArea.scrollHeight;
        }

        function clearLogs() {
            document.getElementById('log-area').innerHTML = `
                <div class="log-entry">
                    <span class="log-time">[系统]</span>
                    <span>日志已清空</span>
                </div>
            `;
        }

        function updateProgress(percent) {
            document.getElementById('progress-fill').style.width = percent + '%';
            document.getElementById('progress-percent').textContent = percent + '%';
        }

        function setStageStatus(stageIndex, status) {
            const stage = document.getElementById(stages[stageIndex].id);
            const statusEl = stage.querySelector('.stage-status');
            
            stage.classList.remove('active', 'completed');
            if (status === 'active') {
                stage.classList.add('active');
                statusEl.textContent = '执行中...';
                statusEl.classList.add('pulse');
            } else if (status === 'completed') {
                stage.classList.add('completed');
                statusEl.textContent = '✓ 已完成';
                statusEl.classList.remove('pulse');
            } else {
                statusEl.textContent = '等待中';
            }
        }

        function setAgentStatus(agentId, status, text) {
            const agent = document.getElementById(agentId);
            agent.className = 'agent-status ' + status;
            agent.textContent = text;
        }

        function resetAllAgents() {
            setAgentStatus('agent-pm', 'idle', '○ 空闲');
            setAgentStatus('agent-arch', 'idle', '○ 空闲');
            setAgentStatus('agent-dev', 'idle', '○ 空闲');
            setAgentStatus('agent-test', 'idle', '○ 空闲');
            setAgentStatus('agent-ops', 'idle', '○ 空闲');
        }

        async function executeStage(index) {
            if (index >= stages.length) return true;

            const stage = stages[index];
            
            // 设置阶段为活跃状态
            setStageStatus(index, 'active');
            setAgentStatus(stage.agent, 'working', '● 工作中');
            
            addLog(`▶ 开始执行：${stage.name}`, 'info');
            
            // 模拟执行过程
            const steps = 5;
            const stepDuration = stage.duration / steps;
            
            for (let i = 1; i <= steps; i++) {
                await sleep(stepDuration);
                const progress = Math.round((i / steps) * 100);
                
                if (i === 1) {
                    addLog(`  ↳ 正在处理 ${stage.name}...`, 'info');
                } else if (i === steps) {
                    addLog(`  ↳ 完成 ${stage.name} (${progress}%)`, 'success');
                } else {
                    addLog(`  ↳ 进度 ${progress}%...`, 'info');
                }
                
                updateProgress(Math.round(((index + i/steps) / stages.length) * 100));
            }
            
            // 标记阶段完成
            setStageStatus(index, 'completed');
            setAgentStatus(stage.agent, 'completed', '✓ 已完成');
            
            addLog(`✓ ${stage.name} 执行完成`, 'success');
            addLog('─────────────────────────────────────', 'info');
            
            return true;
        }

        async function startPipeline() {
            if (isRunning) return;
            
            isRunning = true;
            currentStage = 0;
            
            // 重置所有阶段
            stages.forEach((_, index) => {
                setStageStatus(index, 'pending');
            });
            
            resetAllAgents();
            clearLogs();
            
            addLog('🚀 启动研发自动化流水线...', 'success');
            addLog('项目名称：电商平台重构项目', 'info');
            addLog('目标版本：v2.0.0', 'info');
            addLog('─────────────────────────────────────', 'info');
            
            // 依次执行每个阶段
            for (let i = 0; i < stages.length; i++) {
                await executeStage(i);
                
                // 阶段间短暂延迟
                if (i < stages.length - 1) {
                    await sleep(1000);
                }
            }
            
            addLog('🎉 流水线执行完成！', 'success');
            addLog('✓ 所有阶段均已成功完成', 'success');
            updateProgress(100);
            
            isRunning = false;
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            resetAllAgents();
            updateProgress(0);
        });
    </script>
</body>
</html>
