<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRD Generator Agent - 测试报告</title>
    <style>
        :root {
            --primary-color: #00f5ff;
            --secondary-color: #7b2cbf;
            --success-color: #00ff88;
            --error-color: #ff4757;
            --warning-color: #ffa502;
            --bg-color: #0a0e1a;
            --card-bg: rgba(20, 30, 50, 0.8);
            --text-color: #e0e0e0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1a2e 50%, #16213e 100%);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(0, 245, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(123, 44, 191, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 2px solid var(--primary-color);
            margin-bottom: 40px;
            position: relative;
        }
        
        header h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, var(--primary-color), var(--success-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(0, 245, 255, 0.3);
        }
        
        header .subtitle {
            color: #888;
            font-size: 1.1em;
        }
        
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(0, 245, 255, 0.2);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 245, 255, 0.2);
        }
        
        .card-title {
            font-size: 0.9em;
            color: #888;
            margin-bottom: 10px;
        }
        
        .card-value {
            font-size: 2.5em;
            font-weight: bold;
        }
        
        .card-value.total { color: var(--primary-color); }
        .card-value.passed { color: var(--success-color); }
        .card-value.failed { color: var(--error-color); }
        .card-value.rate { color: var(--warning-color); }
        
        .section {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(123, 44, 191, 0.3);
        }
        
        .section h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 245, 255, 0.2);
        }
        
        .test-suite {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .test-suite-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .test-suite-name {
            font-size: 1.2em;
            color: var(--primary-color);
        }
        
        .test-suite-stats {
            display: flex;
            gap: 15px;
        }
        
        .stat {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
        }
        
        .stat.pass {
            background: rgba(0, 255, 136, 0.2);
            color: var(--success-color);
        }
        
        .stat.fail {
            background: rgba(255, 71, 87, 0.2);
            color: var(--error-color);
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success-color), var(--primary-color));
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        .failure-detail {
            background: rgba(255, 71, 87, 0.1);
            border-left: 3px solid var(--error-color);
            padding: 15px;
            margin-top: 10px;
            border-radius: 0 5px 5px 0;
        }
        
        .failure-detail code {
            display: block;
            margin-top: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            font-size: 0.85em;
            overflow-x: auto;
            color: #ff6b6b;
        }
        
        footer {
            text-align: center;
            padding: 30px;
            color: #666;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }
            
            .summary-cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 PRD Generator Agent</h1>
            <p class="subtitle">单元测试与功能验证报告</p>
            <p style="color: #666; margin-top: 10px;">生成时间：2026-03-15 07:51:14</p>
        </header>
        
        <div class="summary-cards">
            <div class="card">
                <div class="card-title">总测试数</div>
                <div class="card-value total">42</div>
            </div>
            <div class="card">
                <div class="card-title">通过</div>
                <div class="card-value passed">42</div>
            </div>
            <div class="card">
                <div class="card-title">失败</div>
                <div class="card-value failed">0</div>
            </div>
            <div class="card">
                <div class="card-title">通过率</div>
                <div class="card-value rate">100.0%</div>
            </div>
        </div>
        
        <div class="section">
            <h2>📊 测试套件详情</h2>

            <div class="test-suite">
                <div class="test-suite-header">
                    <div class="test-suite-name">Unit Tests</div>
                    <div class="test-suite-stats">
                        <span class="stat pass">✓ 33 通过</span>
                        <span class="stat fail">✗ 0 失败</span>
                    </div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 100.0%"></div>
                </div>
</div>
            <div class="test-suite">
                <div class="test-suite-header">
                    <div class="test-suite-name">Integration Tests</div>
                    <div class="test-suite-stats">
                        <span class="stat pass">✓ 9 通过</span>
                        <span class="stat fail">✗ 0 失败</span>
                    </div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 100.0%"></div>
                </div>
</div>
        </div>
        
        <footer>
            <p>PRD Generator Agent v1.0.0 | 端到端研发自动化系统</p>
            <p style="margin-top: 10px;">基于 OpenClaw + Claude Code 的智能研发平台</p>
        </footer>
    </div>
</body>
</html>
