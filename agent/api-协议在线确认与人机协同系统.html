<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 协议在线确认与人机协同系统 | OpenClaw + Claude Code</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">🦞</span>
                    <h1>API Protocol Hub</h1>
                    <span class="subtitle">OpenClaw + Claude Code 端到端研发自动化</span>
                </div>
                <div class="header-actions">
                    <button id="newProtocolBtn" class="btn btn-primary">
                        <span>➕</span> 新建 API 协议
                    </button>
                    <div class="user-info">
                        <span class="status-indicator online"></span>
                        <span id="userName">开发者</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Sidebar -->
            <aside class="sidebar">
                <nav class="nav-menu">
                    <a href="#" class="nav-item active" data-view="protocols">
                        <span class="nav-icon">📋</span>
                        <span>协议列表</span>
                    </a>
                    <a href="#" class="nav-item" data-view="collaboration">
                        <span class="nav-icon">🤝</span>
                        <span>人机协同</span>
                    </a>
                    <a href="#" class="nav-item" data-view="validation">
                        <span class="nav-icon">✅</span>
                        <span>AI 验证</span>
                    </a>
                    <a href="#" class="nav-item" data-view="audit">
                        <span class="nav-icon">📊</span>
                        <span>审计日志</span>
                    </a>
                </nav>

                <div class="sidebar-section">
                    <h3>实时状态</h3>
                    <div class="status-panel">
                        <div class="status-item">
                            <span class="label">WebSocket:</span>
                            <span id="wsStatus" class="value">连接中...</span>
                        </div>
                        <div class="status-item">
                            <span class="label">AI Agent:</span>
                            <span id="aiStatus" class="value value-ready">就绪</span>
                        </div>
                        <div class="status-item">
                            <span class="label">OpenClaw:</span>
                            <span id="openclawStatus" class="value value-ready">已集成</span>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Content Area -->
            <section class="content-area">
                <!-- Protocols View -->
                <div id="protocolsView" class="view active">
                    <div class="view-header">
                        <h2>API 协议管理</h2>
                        <div class="view-actions">
                            <select id="statusFilter" class="filter-select">
                                <option value="">全部状态</option>
                                <option value="draft">草稿</option>
                                <option value="pending_review">待审核</option>
                                <option value="approved">已批准</option>
                                <option value="rejected">已拒绝</option>
                            </select>
                        </div>
                    </div>

                    <div id="protocolsList" class="protocols-list">
                        <!-- Protocols will be loaded here -->
                    </div>
                </div>

                <!-- Collaboration View -->
                <div id="collaborationView" class="view">
                    <div class="view-header">
                        <h2>人机协同工作区</h2>
                        <button id="newSessionBtn" class="btn btn-secondary">创建协同会话</button>
                    </div>

                    <div class="collaboration-container">
                        <div class="session-list">
                            <h3>活跃会话</h3>
                            <div id="activeSessions" class="sessions-grid">
                                <!-- Sessions will be loaded here -->
                            </div>
                        </div>

                        <div class="chat-panel">
                            <div class="chat-messages" id="chatMessages">
                                <div class="message system">
                                    <div class="message-content">
                                        欢迎使用人机协同工作区！在这里，您可以与 AI Agent（Claude Code）实时协作，共同设计和优化 API 协议。
                                    </div>
                                </div>
                            </div>
                            <div class="chat-input-area">
                                <input type="text" id="chatInput" placeholder="输入消息或与 AI 协作..." class="chat-input">
                                <button id="sendMessageBtn" class="btn btn-primary">发送</button>
                                <button id="aiAssistBtn" class="btn btn-ai">🤖 AI 协助</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Validation View -->
                <div id="validationView" class="view">
                    <div class="view-header">
                        <h2>AI 智能验证</h2>
                        <button id="validateAllBtn" class="btn btn-primary">批量验证</button>
                    </div>

                    <div class="validation-dashboard">
                        <div class="validation-stats">
                            <div class="stat-card">
                                <div class="stat-value" id="totalProtocols">0</div>
                                <div class="stat-label">总协议数</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value" id="validatedProtocols">0</div>
                                <div class="stat-label">已验证</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value" id="issuesFound">0</div>
                                <div class="stat-label">发现问题</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value" id="aiSuggestions">0</div>
                                <div class="stat-label">AI 建议</div>
                            </div>
                        </div>

                        <div id="validationResults" class="validation-results">
                            <!-- Validation results will be displayed here -->
                        </div>
                    </div>
                </div>

                <!-- Audit View -->
                <div id="auditView" class="view">
                    <div class="view-header">
                        <h2>审计日志</h2>
                        <button id="exportLogsBtn" class="btn btn-secondary">导出日志</button>
                    </div>

                    <div id="auditLogs" class="audit-logs">
                        <!-- Audit logs will be loaded here -->
                    </div>
                </div>
            </section>
        </main>

        <!-- Modal: New Protocol -->
        <div id="newProtocolModal" class="modal">
            <div class="modal-content modal-large">
                <div class="modal-header">
                    <h3>创建新 API 协议</h3>
                    <button class="modal-close">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="newProtocolForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="protocolName">协议名称 *</label>
                                <input type="text" id="protocolName" required class="form-control">
                            </div>
                            <div class="form-group">
                                <label for="protocolVersion">版本号 *</label>
                                <input type="text" id="protocolVersion" value="1.0.0" required class="form-control">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="protocolDescription">描述</label>
                            <textarea id="protocolDescription" rows="3" class="form-control"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="protocolAuthor">作者 *</label>
                            <input type="text" id="protocolAuthor" required class="form-control">
                        </div>

                        <div class="form-group">
                            <label>端点定义</label>
                            <div id="endpointsContainer" class="endpoints-container">
                                <!-- Endpoint templates will be added here -->
                            </div>
                            <button type="button" id="addEndpointBtn" class="btn btn-secondary btn-sm">
                                + 添加端点
                            </button>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary modal-close">取消</button>
                    <button type="button" id="saveProtocolBtn" class="btn btn-primary">保存协议</button>
                </div>
            </div>
        </div>

        <!-- Modal: Protocol Details -->
        <div id="protocolDetailsModal" class="modal">
            <div class="modal-content modal-xlarge">
                <div class="modal-header">
                    <h3 id="detailProtocolTitle">协议详情</h3>
                    <button class="modal-close">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="protocol-detail-tabs">
                        <button class="tab-btn active" data-tab="overview">概览</button>
                        <button class="tab-btn" data-tab="endpoints">端点</button>
                        <button class="tab-btn" data-tab="validation">验证结果</button>
                        <button class="tab-btn" data-tab="reviews">审核记录</button>
                        <button class="tab-btn" data-tab="collaboration">协同记录</button>
                    </div>

                    <div class="tab-content">
                        <div id="tab-overview" class="tab-pane active">
                            <!-- Overview content -->
                        </div>
                        <div id="tab-endpoints" class="tab-pane">
                            <!-- Endpoints content -->
                        </div>
                        <div id="tab-validation" class="tab-pane">
                            <!-- Validation content -->
                        </div>
                        <div id="tab-reviews" class="tab-pane">
                            <!-- Reviews content -->
                        </div>
                        <div id="tab-collaboration" class="tab-pane">
                            <!-- Collaboration content -->
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary modal-close">关闭</button>
                    <button type="button" id="validateProtocolBtn" class="btn btn-ai">🤖 AI 验证</button>
                    <button type="button" id="submitReviewBtn" class="btn btn-primary">提交审核</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
