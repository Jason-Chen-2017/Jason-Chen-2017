<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoDev Pipeline - 智能研发自动化流水线系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #00f0ff;
            --secondary-color: #7b2cbf;
            --accent-color: #ff006e;
            --bg-dark: #0a0a1a;
            --bg-card: rgba(20, 20, 40, 0.8);
            --text-primary: #ffffff;
            --text-secondary: #a0a0c0;
            --success: #00ff88;
            --warning: #ffaa00;
            --danger: #ff4466;
            --quantum-glow: 0 0 20px rgba(0, 240, 255, 0.5);
            --neon-glow: 0 0 10px rgba(123, 44, 191, 0.7);
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1a3a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景动画 */
        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary-color);
            border-radius: 50%;
            animation: float 15s infinite;
            opacity: 0.3;
            box-shadow: var(--quantum-glow);
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .quantum-ring {
            position: absolute;
            border: 2px solid var(--primary-color);
            border-radius: 50%;
            animation: pulse-ring 8s infinite;
            opacity: 0.1;
        }

        @keyframes pulse-ring {
            0%, 100% {
                transform: scale(0.5);
                opacity: 0.1;
            }
            50% {
                transform: scale(1.5);
                opacity: 0.3;
            }
        }

        /* 头部 */
        header {
            background: linear-gradient(135deg, rgba(20, 20, 40, 0.95), rgba(40, 40, 80, 0.9));
            backdrop-filter: blur(20px);
            border-bottom: 2px solid var(--primary-color);
            box-shadow: var(--quantum-glow);
            padding: 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(0, 240, 255, 0.1) 50%,
                transparent 70%
            );
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: var(--neon-glow);
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 1;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            position: relative;
            z-index: 1;
        }

        /* 主容器 */
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* 状态卡片网格 */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .status-card {
            background: var(--bg-card);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 15px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .status-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(0, 240, 255, 0.1),
                transparent
            );
            transition: left 0.5s ease;
        }

        .status-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
            box-shadow: var(--quantum-glow);
        }

        .status-card:hover::before {
            left: 100%;
        }

        .status-card h3 {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-value {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 0.5rem;
            animation: blink 2s infinite;
        }

        .status-indicator.running {
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
        }

        .status-indicator.busy {
            background: var(--warning);
            box-shadow: 0 0 10px var(--warning);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Agents 区域 */
        .section {
            background: var(--bg-card);
            border: 1px solid rgba(123, 44, 191, 0.3);
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
        }

        .section-title {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-shadow: var(--neon-glow);
        }

        .section-title::before {
            content: '⚡';
            font-size: 1.5rem;
        }

        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
        }

        .agent-card {
            background: rgba(30, 30, 60, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 10px;
            padding: 1rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .agent-card:hover {
            border-color: var(--primary-color);
            background: rgba(40, 40, 80, 0.8);
            transform: scale(1.02);
        }

        .agent-card.active {
            border-color: var(--success);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        .agent-name {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 0.3rem;
        }

        .agent-role {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .agent-model {
            font-size: 0.8rem;
            color: var(--secondary-color);
            background: rgba(123, 44, 191, 0.2);
            padding: 0.2rem 0.5rem;
            border-radius: 5px;
            display: inline-block;
        }

        .agent-status {
            margin-top: 0.5rem;
            font-size: 0.85rem;
        }

        .agent-stats {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* 工作流可视化 */
        .workflow-container {
            position: relative;
            padding: 2rem 0;
        }

        .workflow-steps {
            display: flex;
            justify-content: space-between;
            position: relative;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .workflow-steps::before {
            content: '';
            position: absolute;
            top: 40px;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color), var(--accent-color));
            z-index: 0;
            display: none;
        }

        .workflow-step {
            flex: 1;
            min-width: 150px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .step-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem;
            background: linear-gradient(135deg, var(--bg-card), rgba(40, 40, 80, 0.8));
            border: 2px solid var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            transition: all 0.3s ease;
            box-shadow: var(--quantum-glow);
        }

        .workflow-step.completed .step-icon {
            border-color: var(--success);
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 240, 255, 0.1));
            animation: complete-pulse 1s infinite;
        }

        .workflow-step.running .step-icon {
            border-color: var(--warning);
            animation: running-pulse 1s infinite;
        }

        @keyframes complete-pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 136, 0.5); }
            50% { box-shadow: 0 0 40px rgba(0, 255, 136, 0.8); }
        }

        @keyframes running-pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 170, 0, 0.5); }
            50% { box-shadow: 0 0 40px rgba(255, 170, 0, 0.8); }
        }

        .step-name {
            font-weight: bold;
            color: var(--text-primary);
            margin-bottom: 0.3rem;
        }

        .step-agent {
            font-size: 0.8rem;
            color: var(--secondary-color);
        }

        .step-duration {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.3rem;
        }

        /* 任务创建表单 */
        .task-form {
            display: grid;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        input[type="text"],
        textarea,
        select {
            background: rgba(30, 30, 60, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px;
            padding: 0.8rem 1rem;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: var(--quantum-glow);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: var(--neon-glow);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-start {
            background: linear-gradient(135deg, var(--success), #00cc6a);
        }

        /* 任务列表 */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .task-item {
            background: rgba(30, 30, 60, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 10px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .task-item:hover {
            border-color: var(--primary-color);
            background: rgba(40, 40, 80, 0.8);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .task-id {
            font-family: 'Courier New', monospace;
            color: var(--primary-color);
            font-size: 0.9rem;
        }

        .task-priority {
            padding: 0.3rem 0.8rem;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .priority-high {
            background: rgba(255, 68, 102, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .priority-medium {
            background: rgba(255, 170, 0, 0.2);
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        .priority-low {
            background: rgba(0, 240, 255, 0.2);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
        }

        .task-description {
            color: var(--text-primary);
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .task-progress {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            transition: width 0.5s ease;
            box-shadow: var(--quantum-glow);
        }

        .task-meta {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .task-status-badge {
            padding: 0.3rem 0.8rem;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .status-pending {
            background: rgba(160, 160, 192, 0.2);
            color: var(--text-secondary);
        }

        .status-running {
            background: rgba(255, 170, 0, 0.2);
            color: var(--warning);
        }

        .status-completed {
            background: rgba(0, 255, 136, 0.2);
            color: var(--success);
        }

        .status-failed {
            background: rgba(255, 68, 102, 0.2);
            color: var(--danger);
        }

        /* 日志终端 */
        .log-terminal {
            background: rgba(10, 10, 20, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 10px;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            max-height: 400px;
            overflow-y: auto;
        }

        .log-entry {
            margin-bottom: 0.5rem;
            line-height: 1.5;
        }

        .log-timestamp {
            color: var(--secondary-color);
            margin-right: 0.5rem;
        }

        .log-info {
            color: var(--primary-color);
        }

        .log-success {
            color: var(--success);
        }

        .log-error {
            color: var(--danger);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .container {
                padding: 1rem;
            }

            .status-grid {
                grid-template-columns: 1fr;
            }

            .workflow-steps {
                flex-direction: column;
            }

            .workflow-steps::before {
                display: none;
            }
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 240, 255, 0.3);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--secondary-color);
        }
    </style>
</head>
<body>
    <!-- 背景动画 -->
    <div class="background-animation" id="bgAnimation"></div>

    <!-- 头部 -->
    <header>
        <h1>🚀 AutoDev Pipeline</h1>
        <p class="subtitle">基于 OpenClaw + Claude Code 的端到端研发自动化系统</p>
        <p style="color: var(--text-secondary); margin-top: 0.5rem; font-size: 0.9rem;">
            从需求 → PRD 设计 → 技术方案 → API 协议 → AI Coding → 测试 → 部署 → 验收全流程自动化
        </p>
    </header>

    <!-- 主容器 -->
    <div class="container">
        <!-- 系统状态卡片 -->
        <div class="status-grid">
            <div class="status-card">
                <h3>
                    <span class="status-indicator running" id="orchestratorIndicator"></span>
                    编排器状态
                </h3>
                <div class="status-value" id="orchestratorStatus">Running</div>
            </div>
            <div class="status-card">
                <h3>活跃 Agents</h3>
                <div class="status-value" id="activeAgents">0/10</div>
            </div>
            <div class="status-card">
                <h3>进行中任务</h3>
                <div class="status-value" id="runningTasks">0</div>
            </div>
            <div class="status-card">
                <h3>今日完成</h3>
                <div class="status-value" id="completedToday">0</div>
            </div>
            <div class="status-card">
                <h3>系统健康度</h3>
                <div class="status-value" id="systemHealth" style="color: var(--success);">Healthy</div>
            </div>
            <div class="status-card">
                <h3>CPU 使用率</h3>
                <div class="status-value" id="cpuUsage">0%</div>
            </div>
        </div>

        <!-- Agents 区域 -->
        <div class="section">
            <h2 class="section-title">研发角色 Agents</h2>
            <div class="agents-grid" id="agentsGrid">
                <!-- Agents 将通过 JavaScript 动态加载 -->
            </div>
        </div>

        <!-- 工作流可视化 -->
        <div class="section">
            <h2 class="section-title">端到端研发工作流</h2>
            <div class="workflow-container">
                <div class="workflow-steps" id="workflowSteps">
                    <!-- 工作流步骤将通过 JavaScript 动态加载 -->
                </div>
            </div>
        </div>

        <!-- 创建任务 -->
        <div class="section">
            <h2 class="section-title">创建新任务</h2>
            <div class="task-form">
                <div class="form-group">
                    <label for="taskDescription">任务描述</label>
                    <textarea 
                        id="taskDescription" 
                        placeholder="请输入任务描述，例如：为用户管理系统添加密码重置功能，包括发送邮件验证码、验证令牌、更新密码..."
                    ></textarea>
                </div>
                <div class="form-group">
                    <label for="taskPriority">优先级</label>
                    <select id="taskPriority">
                        <option value="low">低优先级</option>
                        <option value="medium" selected>中优先级</option>
                        <option value="high">高优先级</option>
                    </select>
                </div>
                <button class="btn btn-start" onclick="createTask()">
                    ⚡ 启动自动化流程
                </button>
            </div>
        </div>

        <!-- 任务列表 -->
        <div class="section">
            <h2 class="section-title">任务列表</h2>
            <div class="task-list" id="taskList">
                <!-- 任务列表将通过 JavaScript 动态加载 -->
            </div>
        </div>

        <!-- 日志终端 -->
        <div class="section">
            <h2 class="section-title">系统日志</h2>
            <div class="log-terminal" id="logTerminal">
                <div class="log-entry">
                    <span class="log-timestamp">[2026-03-16 01:33:50]</span>
                    <span class="log-info">系统初始化完成，等待任务...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== 背景动画 ====================
        function createBackgroundAnimation() {
            const container = document.getElementById('bgAnimation');
            
            // 创建粒子
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                container.appendChild(particle);
            }
            
            // 创建量子环
            for (let i = 0; i < 5; i++) {
                const ring = document.createElement('div');
                ring.className = 'quantum-ring';
                const size = Math.random() * 300 + 200;
                ring.style.width = size + 'px';
                ring.style.height = size + 'px';
                ring.style.left = Math.random() * 100 + '%';
                ring.style.top = Math.random() * 100 + '%';
                ring.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(ring);
            }
        }

        // ==================== 数据状态 ====================
        let agents = [];
        let tasks = [];
        let workflowSteps = [];

        // ==================== API 调用 ====================
        const API_BASE = 'http://localhost:8000/api';

        async function fetchStatus() {
            try {
                const response = await fetch(`${API_BASE}/status`);
                const status = await response.json();
                
                document.getElementById('orchestratorStatus').textContent = 
                    status.orchestrator_status === 'running' ? 'Running' : 'Stopped';
                document.getElementById('activeAgents').textContent = 
                    `${status.active_agents}/${status.total_agents}`;
                document.getElementById('runningTasks').textContent = status.running_tasks;
                document.getElementById('completedToday').textContent = status.completed_today;
                document.getElementById('systemHealth').textContent = 
                    status.system_health === 'healthy' ? 'Healthy' : 'Busy';
                document.getElementById('systemHealth').style.color = 
                    status.system_health === 'healthy' ? 'var(--success)' : 'var(--warning)';
                document.getElementById('cpuUsage').textContent = 
                    `${status.cpu_usage.toFixed(1)}%`;
                
                updateOrchestratorIndicator(status.orchestrator_status);
            } catch (error) {
                console.error('获取状态失败:', error);
                // 使用模拟数据
                updateWithMockData();
            }
        }

        function updateOrchestratorIndicator(status) {
            const indicator = document.getElementById('orchestratorIndicator');
            indicator.className = 'status-indicator ' + (status === 'running' ? 'running' : 'busy');
        }

        async function fetchAgents() {
            try {
                const response = await fetch(`${API_BASE}/agents`);
                agents = await response.json();
                renderAgents();
            } catch (error) {
                console.error('获取 Agents 失败:', error);
                // 使用模拟数据
                useMockAgents();
                renderAgents();
            }
        }

        async function fetchTasks() {
            try {
                const response = await fetch(`${API_BASE}/tasks`);
                tasks = await response.json();
                renderTasks();
            } catch (error) {
                console.error('获取任务失败:', error);
            }
        }

        async function fetchWorkflow() {
            try {
                const response = await fetch(`${API_BASE}/workflow/template`);
                const workflow = await response.json();
                workflowSteps = workflow.steps;
                renderWorkflow();
            } catch (error) {
                console.error('获取工作流失败:', error);
                useMockWorkflow();
                renderWorkflow();
            }
        }

        // ==================== 模拟数据 ====================
        function useMockAgents() {
            agents = [

                { id: "agent_003", name: "后端架构师", role: "backend_architect", model: "Codex GPT-5.3", status: "running", current_task: "task_abc123", completed_tasks: 142, success_rate: 94.2 },
                { id: "agent_004", name: "前端架构师", role: "frontend_architect", model: "Gemini Pro", status: "idle", completed_tasks: 98, success_rate: 97.1 },
                { id: "agent_005", name: "API 协议设计师", role: "api_designer", model: "Codex GPT-5.3", status: "idle", completed_tasks: 156, success_rate: 95.5 },
                { id: "agent_006", name: "AI Coding", role: "ai_coding", model: "Codex GPT-5.3", status: "running", current_task: "task_def456", completed_tasks: 523, success_rate: 93.8 },
                { id: "agent_007", name: "单元测试", role: "unit_test", model: "Codex GPT-5.3", status: "idle", completed_tasks: 445, success_rate: 96.9 },
                { id: "agent_008", name: "集成测试", role: "integration_test", model: "Codex GPT-5.3", status: "idle", completed_tasks: 267, success_rate: 94.7 },
                { id: "agent_009", name: "CI/CD 部署", role: "ci_cd", model: "Claude Code", status: "idle", completed_tasks: 189, success_rate: 97.3 },
                { id: "agent_010", name: "UI 自动化测试", role: "ui_test", model: "OpenClaw + Playwright", status: "idle", completed_tasks: 234, success_rate: 95.2 }
            ];
        }

        function useMockWorkflow() {
            workflowSteps = [
                { step: 1, name: "需求分析", agent: "需求分析师", description: "收集并整理用户需求" },
                { step: 2, name: "PRD 设计", agent: "PRD 设计师", description: "撰写产品需求文档" },
                { step: 3, name: "后端方案设计", agent: "后端架构师", description: "设计系统架构" },
                { step: 4, name: "前端方案设计", agent: "前端架构师", description: "设计前端架构" },
                { step: 5, name: "API 协议设计", agent: "API 协议设计师", description: "设计 RESTful API" },
                { step: 6, name: "AI 编码", agent: "AI Coding", description: "自动生成代码" },
                { step: 7, name: "单元测试", agent: "单元测试", description: "编写单元测试" },
                { step: 8, name: "集成测试", agent: "集成测试", description: "执行集成测试" },
                { step: 9, name: "CI/CD 部署", agent: "CI/CD 部署", description: "容器化部署" },
                { step: 10, name: "UI 自动化验收", agent: "UI 自动化测试", description: "E2E 测试" }
            ];
        }

        function updateWithMockData() {
            document.getElementById('orchestratorStatus').textContent = 'Running';
            document.getElementById('activeAgents').textContent = '2/10';
            document.getElementById('runningTasks').textContent = Math.floor(Math.random() * 3);
            document.getElementById('completedToday').textContent = Math.floor(Math.random() * 20) + 10;
            document.getElementById('cpuUsage').textContent = (Math.random() * 40 + 30).toFixed(1) + '%';
        }

        // ==================== 渲染函数 ====================
        function renderAgents() {
            const grid = document.getElementById('agentsGrid');
            grid.innerHTML = agents.map(agent => `
                <div class="agent-card ${agent.status === 'running' ? 'active' : ''}">
                    <div class="agent-name">${agent.name}</div>
                    <div class="agent-role">${agent.role}</div>
                    <div class="agent-model">${agent.model}</div>
                    <div class="agent-status">
                        状态：<span style="color: ${agent.status === 'running' ? 'var(--warning)' : 'var(--text-secondary)'}">
                            ${agent.status === 'running' ? '🔄 运行中' : '✅ 空闲'}
                        </span>
                    </div>
                    <div class="agent-stats">
                        <span>完成任务：${agent.completed_tasks}</span>
                        <span>成功率：${agent.success_rate}%</span>
                    </div>
                </div>
            `).join('');
        }

        function renderWorkflow() {
            const container = document.getElementById('workflowSteps');
            container.innerHTML = workflowSteps.map((step, index) => {
                const task = tasks.find(t => t.status === 'running');
                const currentStepIndex = task ? task.subtasks?.findIndex(st => st.status === 'running') : -1;
                const isCompleted = task && currentStepIndex > index;
                const isRunning = task && currentStepIndex === index;
                
                return `
                    <div class="workflow-step ${isCompleted ? 'completed' : ''} ${isRunning ? 'running' : ''}">
                        <div class="step-icon">
                            ${getStepIcon(index)}
                        </div>
                        <div class="step-name">${step.name}</div>
                        <div class="step-agent">${step.agent}</div>
                        ${task && task.subtasks && task.subtasks[index] && task.subtasks[index].duration ? 
                            `<div class="step-duration">⏱️ ${task.subtasks[index].duration}</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        function getStepIcon(index) {
            const icons = ['📋', '📄', '🏗️', '🎨', '🔌', '💻', '✅', '🔗', '🚀', '🤖'];
            return icons[index] || '⚡';
        }

        function renderTasks() {
            const list = document.getElementById('taskList');
            if (tasks.length === 0) {
                list.innerHTML = '<div style="text-align: center; color: var(--text-secondary); padding: 2rem;">暂无任务，创建一个新任务开始自动化流程吧！</div>';
                return;
            }
            
            list.innerHTML = tasks.map(task => `
                <div class="task-item">
                    <div class="task-header">
                        <span class="task-id">${task.id}</span>
                        <span class="task-priority priority-${task.priority}">
                            ${task.priority === 'high' ? '🔥 高优先级' : task.priority === 'medium' ? '⚡ 中优先级' : '📌 低优先级'}
                        </span>
                        <span class="task-status-badge status-${task.status}">
                            ${task.status === 'pending' ? '⏳ 等待中' : 
                              task.status === 'running' ? '🔄 执行中' : 
                              task.status === 'completed' ? '✅ 已完成' : '❌ 失败'}
                        </span>
                    </div>
                    <div class="task-description">${task.description}</div>
                    <div class="task-progress">
                        <div class="progress-bar" style="width: ${task.progress}%"></div>
                    </div>
                    <div class="task-meta">
                        <span>📅 创建时间：${new Date(task.created_at).toLocaleString('zh-CN')}</span>
                        <span>🔄 进度：${task.progress}%</span>
                        ${task.assigned_agent ? `<span>🤖 执行 Agent: ${task.assigned_agent}</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function addLog(message, type = 'info') {
            const terminal = document.getElementById('logTerminal');
            const now = new Date().toLocaleString('zh-CN');
            const logClass = type === 'success' ? 'log-success' : type === 'error' ? 'log-error' : 'log-info';
            
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `
                <span class="log-timestamp">[${now}]</span>
                <span class="${logClass}">${message}</span>
            `;
            
            terminal.appendChild(entry);
            terminal.scrollTop = terminal.scrollHeight;
        }

        // ==================== 操作函数 ====================
        async function createTask() {
            const description = document.getElementById('taskDescription').value.trim();
            const priority = document.getElementById('taskPriority').value;
            
            if (!description) {
                alert('请输入任务描述');
                return;
            }
            
            addLog(`正在创建任务：${description.substring(0, 50)}...`, 'info');
            
            try {
                const response = await fetch(`${API_BASE}/tasks`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        description: description,
                        priority: priority
                    })
                });
                
                if (response.ok) {
                    const task = await response.json();
                    addLog(`✅ 任务创建成功：${task.id}`, 'success');
                    document.getElementById('taskDescription').value = '';
                    await fetchTasks();
                    
                    // 自动启动任务
                    setTimeout(() => startTask(task.id), 1000);
                } else {
                    throw new Error('创建失败');
                }
            } catch (error) {
                console.error('创建任务失败:', error);
                addLog('❌ 任务创建失败，使用模拟模式', 'error');
                // 创建模拟任务
                createMockTask(description, priority);
            }
        }

        function createMockTask(description, priority) {
            const taskId = `task_${Math.random().toString(36).substr(2, 8)}`;
            const now = new Date().toISOString();
            
            const subtasks = workflowSteps.map((step, index) => ({
                id: `${taskId}_step_${index + 1}`,
                step: index + 1,
                name: step.name,
                agent: step.agent,
                status: 'pending',
                description: step.description
            }));
            
            const task = {
                id: taskId,
                description: description,
                status: 'pending',
                priority: priority,
                created_at: now,
                updated_at: now,
                assigned_agent: null,
                progress: 0,
                subtasks: subtasks,
                logs: [`[${now}] 任务已创建`]
            };
            
            tasks.unshift(task);
            renderTasks();
            addLog(`✅ 模拟任务创建成功：${taskId}`, 'success');
            
            // 自动启动模拟任务
            setTimeout(() => simulateTaskExecution(taskId), 1000);
        }

        async function startTask(taskId) {
            try {
                const response = await fetch(`${API_BASE}/tasks/${taskId}/start`, {
                    method: 'POST'
                });
                
                if (response.ok) {
                    addLog(`🚀 任务 ${taskId} 已启动`, 'success');
                    await fetchTasks();
                }
            } catch (error) {
                console.error('启动任务失败:', error);
                simulateTaskExecution(taskId);
            }
        }

        async function simulateTaskExecution(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;
            
            task.status = 'running';
            addLog(`🚀 开始执行任务：${task.id}`, 'info');
            
            for (let i = 0; i < task.subtasks.length; i++) {
                const subtask = task.subtasks[i];
                subtask.status = 'running';
                task.progress = Math.round(((i) / task.subtasks.length) * 100);
                
                addLog(`▶️ 执行步骤 ${i + 1}/${task.subtasks.length}: ${subtask.name} (${subtask.agent})`, 'info');
                
                // 更新 UI
                renderTasks();
                renderWorkflow();
                
                // 模拟执行时间
                await new Promise(resolve => setTimeout(resolve, 2000 + Math.random() * 2000));
                
                subtask.status = 'completed';
                subtask.duration = `${Math.floor(Math.random() * 3) + 2}s`;
                addLog(`✅ 完成：${subtask.name}`, 'success');
                
                // 更新 Agent 状态
                const agent = agents.find(a => a.name === subtask.agent);
                if (agent) {
                    agent.completed_tasks++;
                    agent.status = 'running';
                    renderAgents();
                }
            }
            
            task.status = 'completed';
            task.progress = 100;
            addLog(`🎉 任务 ${task.id} 全部完成！`, 'success');
            
            renderTasks();
            renderWorkflow();
        }

        // ==================== 初始化 ====================
        async function init() {
            console.log('初始化 AutoDev Pipeline 界面...');
            createBackgroundAnimation();
            addLog('系统初始化完成', 'success');
            
            await fetchStatus();
            await fetchAgents();
            await fetchWorkflow();
            await fetchTasks();
            
            // 定时刷新
            setInterval(fetchStatus, 5000);
            setInterval(fetchTasks, 3000);
            
            addLog('就绪！请创建任务开始自动化流程', 'success');
        }

        // 启动应用
        init();
    </script>
