<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研发自动化系统 - 部署监控与人机协同</title>
    <style>
        /* ==================== AI 科幻量子炫彩风格 ==================== */
        :root {
            --primary-color: #00f3ff;
            --secondary-color: #7b2cbf;
            --accent-color: #ff006e;
            --success-color: #00ff88;
            --warning-color: #ffbe0b;
            --error-color: #ff0040;
            --bg-dark: #0a0a1a;
            --bg-card: rgba(20, 20, 40, 0.8);
            --text-primary: #ffffff;
            --text-secondary: #a0a0c0;
            --border-glow: 0 0 20px rgba(0, 243, 255, 0.3);
            --card-glow: 0 0 30px rgba(123, 44, 191, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1a3a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景动画粒子效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(123, 44, 191, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 243, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255, 0, 110, 0.1) 0%, transparent 50%);
            z-index: -1;
            animation: backgroundPulse 10s ease-in-out infinite;
        }

        @keyframes backgroundPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        /* 头部样式 */
        header {
            background: linear-gradient(135deg, rgba(20, 20, 40, 0.95) 0%, rgba(40, 20, 60, 0.9) 100%);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid var(--primary-color);
            box-shadow: var(--border-glow);
            padding: 1.5rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
            animation: logoGlow 2s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 243, 255, 0.5); }
            50% { box-shadow: 0 0 40px rgba(0, 243, 255, 0.8); }
        }

        h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-badge {
            padding: 0.5rem 1rem;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--primary-color);
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success-color);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* 主容器 */
        .container {
            max-width: 1600px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        /* 网格布局 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        /* 卡片样式 */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: var(--card-glow);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--primary-color);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
        }

        .card-title {
            font-size: 1.3rem;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Pipeline 列表 */
        .pipeline-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .pipeline-item {
            background: rgba(30, 30, 60, 0.6);
            border: 1px solid rgba(123, 44, 191, 0.3);
            border-radius: 12px;
            padding: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pipeline-item:hover {
            background: rgba(40, 40, 80, 0.8);
            border-color: var(--primary-color);
            transform: translateX(5px);
        }

        .pipeline-item.selected {
            border-color: var(--accent-color);
            box-shadow: 0 0 30px rgba(255, 0, 110, 0.3);
        }

        .pipeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }

        .pipeline-name {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .pipeline-status {
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .status-running {
            background: rgba(0, 243, 255, 0.2);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
        }

        .status-success {
            background: rgba(0, 255, 136, 0.2);
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }

        .status-failed {
            background: rgba(255, 0, 64, 0.2);
            color: var(--error-color);
            border: 1px solid var(--error-color);
        }

        .status-pending {
            background: rgba(255, 190, 11, 0.2);
            color: var(--warning-color);
            border: 1px solid var(--warning-color);
        }

        .pipeline-meta {
            display: flex;
            gap: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* 进度条 */
        .progress-container {
            margin-top: 1rem;
        }

        .progress-bar {
            height: 8px;
            background: rgba(123, 44, 191, 0.3);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            border-radius: 4px;
            transition: width 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* 步骤时间线 */
        .timeline {
            position: relative;
            padding-left: 2rem;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(123, 44, 191, 0.3);
        }

        .timeline-item {
            position: relative;
            padding-bottom: 1.5rem;
        }

        .timeline-item:last-child {
            padding-bottom: 0;
        }

        .timeline-dot {
            position: absolute;
            left: -2rem;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--bg-dark);
            border: 3px solid var(--text-secondary);
            z-index: 1;
        }

        .timeline-item.completed .timeline-dot {
            border-color: var(--success-color);
            background: var(--success-color);
            box-shadow: 0 0 15px var(--success-color);
        }

        .timeline-item.running .timeline-dot {
            border-color: var(--primary-color);
            background: var(--primary-color);
            box-shadow: 0 0 15px var(--primary-color);
            animation: pulse 1s ease-in-out infinite;
        }

        .timeline-item.pending .timeline-dot {
            border-color: var(--warning-color);
            background: var(--warning-color);
        }

        .timeline-content {
            background: rgba(30, 30, 60, 0.4);
            padding: 1rem;
            border-radius: 8px;
            border-left: 3px solid var(--text-secondary);
        }

        .timeline-item.completed .timeline-content {
            border-left-color: var(--success-color);
        }

        .timeline-item.running .timeline-content {
            border-left-color: var(--primary-color);
            background: rgba(0, 243, 255, 0.1);
        }

        .timeline-item.pending .timeline-content {
            border-left-color: var(--warning-color);
            background: rgba(255, 190, 11, 0.1);
        }

        .timeline-title {
            font-weight: bold;
            margin-bottom: 0.3rem;
        }

        .timeline-time {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* 干预面板 */
        .intervention-panel {
            background: rgba(255, 0, 110, 0.05);
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-top: 1rem;
        }

        .intervention-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .intervention-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-approve {
            background: linear-gradient(135deg, var(--success-color), #00cc6a);
            color: white;
        }

        .btn-approve:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .btn-reject {
            background: linear-gradient(135deg, var(--error-color), #cc0033);
            color: white;
        }

        .btn-reject:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(255, 0, 64, 0.5);
        }

        .btn-rollback {
            background: linear-gradient(135deg, var(--warning-color), #cc9900);
            color: white;
        }

        .btn-create {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            width: 100%;
            justify-content: center;
            padding: 1rem;
            font-size: 1rem;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        /* 健康指标 */
        .health-metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }

        .metric-card {
            background: rgba(30, 30, 60, 0.6);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }

        .metric-value {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .metric-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.3rem;
        }

        /* 日志终端 */
        .log-terminal {
            background: rgba(10, 10, 20, 0.9);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 8px;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            max-height: 300px;
            overflow-y: auto;
        }

        .log-line {
            margin-bottom: 0.3rem;
            line-height: 1.4;
        }

        .log-timestamp {
            color: var(--text-secondary);
            margin-right: 0.5rem;
        }

        .log-info {
            color: var(--primary-color);
        }

        .log-success {
            color: var(--success-color);
        }

        .log-error {
            color: var(--error-color);
        }

        /* 响应式设计 */
        @media (max-width: 1200px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(20, 20, 40, 0.5);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 243, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- 头部 -->
    <header>
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">🦞</div>
                <h1>研发自动化系统</h1>
            </div>
            <div class="status-badge">
                <div class="status-dot"></div>
                <span>系统运行中</span>
            </div>
        </div>
    </header>

    <!-- 主容器 -->
    <div class="container">
        <div class="dashboard-grid">
            <!-- 左侧：Pipeline 列表和详情 -->
            <div class="main-panel">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">⚡ 活跃 Pipeline</h2>
                        <button class="btn btn-create" onclick="createPipeline()">
                            ➕ 创建新 Pipeline
                        </button>
                    </div>
                    <div id="pipelineList" class="pipeline-list">
                        <!-- Pipeline 列表将由 JS 动态生成 -->
                    </div>
                </div>

                <div class="card" style="margin-top: 2rem;">
                    <div class="card-header">
                        <h2 class="card-title">📊 Pipeline 详情</h2>
                    </div>
                    <div id="pipelineDetail">
                        <p style="color: var(--text-secondary); text-align: center; padding: 2rem;">
                            请选择一个 Pipeline 查看详情
                        </p>
                    </div>
                </div>
            </div>

            <!-- 右侧：监控面板 -->
            <div class="side-panel">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">💚 部署健康状态</h2>
                    </div>
                    <div id="healthMetrics" class="health-metrics">
                        <div class="metric-card">
                            <div class="metric-value">-</div>
                            <div class="metric-label">CPU 使用率</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-value">-</div>
                            <div class="metric-label">内存使用率</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-value">-</div>
                            <div class="metric-label">错误率</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-value">-</div>
                            <div class="metric-label">P99 延迟 (ms)</div>
                        </div>
                    </div>
                </div>

                <div class="card" style="margin-top: 2rem;">
                    <div class="card-header">
                        <h2 class="card-title">📝 实时日志</h2>
                    </div>
                    <div id="logTerminal" class="log-terminal">
                        <div class="log-line">
                            <span class="log-timestamp">[--:--:--]</span>
                            <span class="log-info">等待连接...</span>
                        </div>
                    </div>
                </div>

                <div id="interventionPanel" class="intervention-panel" style="display: none; margin-top: 2rem;">
                    <div class="intervention-header">
                        ⚠️ 需要人工干预
                    </div>
                    <p id="interventionMessage" style="margin-bottom: 1rem;"></p>
                    <div class="intervention-actions">
                        <button class="btn btn-approve" onclick="approveStep()">
                            ✓ 批准
                        </button>
                        <button class="btn btn-reject" onclick="rejectStep()">
                            ✗ 拒绝
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== 全局状态 ====================
        let pipelines = [];
        let selectedPipelineId = null;
        let websocket = null;
        let currentInterventionStep = null;

        // ==================== WebSocket 连接 ====================
        function connectWebSocket() {
            const wsUrl = `ws://${window.location.hostname}:8000/ws`;
            websocket = new WebSocket(wsUrl);

            websocket.onopen = () => {
                addLog('WebSocket 连接成功', 'success');
            };

            websocket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleWebSocketMessage(data);
            };

            websocket.onerror = (error) => {
                addLog('WebSocket 错误：' + error, 'error');
            };

            websocket.onclose = () => {
                addLog('WebSocket 连接关闭，尝试重连...', 'error');
                setTimeout(connectWebSocket, 3000);
            };
        }

        function handleWebSocketMessage(data) {
            console.log('收到消息:', data);
            
            switch(data.type) {
                case 'pipeline_created':
                    addLog(`新 Pipeline 创建：${data.pipeline_id}`, 'info');
                    loadPipelines();
                    break;
                case 'step_started':
                    addLog(`步骤开始：${data.stage}`, 'info');
                    loadPipelines();
                    if (data.pipeline_id === selectedPipelineId) {
                        loadPipelineDetail(data.pipeline_id);
                    }
                    break;
                case 'step_completed':
                    addLog(`步骤完成：${data.step_id}`, 'success');
                    loadPipelines();
                    if (data.pipeline_id === selectedPipelineId) {
                        loadPipelineDetail(data.pipeline_id);
                    }
                    break;
                case 'pipeline_update':
                    addLog(`Pipeline 更新：${data.message}`, 'info');
                    loadPipelines();
                    if (data.status === 'pending_approval') {
                        showInterventionPanel(data.message);
                    }
                    break;
                case 'intervention_response':
                    addLog(`干预响应：${data.message}`, 'success');
                    hideInterventionPanel();
                    loadPipelines();
                    break;
                case 'pipeline_completed':
                    addLog(`Pipeline 完成！健康状态：${JSON.stringify(data.health)}`, 'success');
                    updateHealthMetrics(data.health);
                    loadPipelines();
                    break;
                case 'rollback_initiated':
                    addLog('部署回滚已启动', 'warning');
                    break;
                case 'rollback_completed':
                    addLog('部署回滚完成', 'success');
                    updateHealthMetrics(data.health);
                    break;
            }
        }

        // ==================== API 调用 ====================
        async function loadPipelines() {
            try {
                const response = await fetch('http://localhost:8000/api/pipelines');
                pipelines = await response.json();
                renderPipelineList();
            } catch (error) {
                addLog('加载 Pipeline 列表失败：' + error, 'error');
            }
        }

        async function loadPipelineDetail(pipelineId) {
            try {
                const response = await fetch(`http://localhost:8000/api/pipelines/${pipelineId}`);
                const pipeline = await response.json();
                renderPipelineDetail(pipeline);
                
                // 加载健康状态
                if (pipeline.deployment_health) {
                    updateHealthMetrics(pipeline.deployment_health);
                }
            } catch (error) {
                addLog('加载 Pipeline 详情失败：' + error, 'error');
            }
        }

        async function createPipeline() {
            try {
                const response = await fetch('http://localhost:8000/api/pipelines', {
                    method: 'POST'
                });
                const pipeline = await response.json();
                addLog(`Pipeline 创建成功：${pipeline.id}`, 'success');
                loadPipelines();
            } catch (error) {
                addLog('创建 Pipeline 失败：' + error, 'error');
            }
        }

        async function approveStep() {
            if (!selectedPipelineId || !currentInterventionStep) return;
            
            try {
                const response = await fetch(`http://localhost:8000/api/pipelines/${selectedPipelineId}/approve`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        pipeline_id: selectedPipelineId,
                        step_id: currentInterventionStep,
                        action: 'approve',
                        comments: '人工审批通过'
                    })
                });
                const result = await response.json();
                addLog('审批通过：' + result.message, 'success');
                hideInterventionPanel();
            } catch (error) {
                addLog('审批失败：' + error, 'error');
            }
        }

        async function rejectStep() {
            if (!selectedPipelineId || !currentInterventionStep) return;
            
            try {
                const response = await fetch(`http://localhost:8000/api/pipelines/${selectedPipelineId}/approve`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        pipeline_id: selectedPipelineId,
                        step_id: currentInterventionStep,
                        action: 'reject',
                        comments: '人工审批拒绝'
                    })
                });
                const result = await response.json();
                addLog('审批拒绝：' + result.message, 'warning');
                hideInterventionPanel();
            } catch (error) {
                addLog('拒绝失败：' + error, 'error');
            }
        }

        async function rollbackDeployment() {
            if (!selectedPipelineId) return;
            
            try {
                const response = await fetch(`http://localhost:8000/api/pipelines/${selectedPipelineId}/rollback`, {
                    method: 'POST'
                });
                const result = await response.json();
                addLog('回滚操作：' + result.message, 'info');
            } catch (error) {
                addLog('回滚失败：' + error, 'error');
            }
        }

        // ==================== 渲染函数 ====================
        function renderPipelineList() {
            const container = document.getElementById('pipelineList');
            
            if (pipelines.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary); text-align: center; padding: 2rem;">暂无活跃 Pipeline</p>';
                return;
            }

            container.innerHTML = pipelines.map(pipeline => `
                <div class="pipeline-item ${pipeline.id === selectedPipelineId ? 'selected' : ''}" 
                     onclick="selectPipeline('${pipeline.id}')">
                    <div class="pipeline-header">
                        <div class="pipeline-name">${pipeline.name}</div>
                        <div class="pipeline-status status-${pipeline.status}">
                            ${getStatusText(pipeline.status)}
                        </div>
                    </div>
                    <div class="pipeline-meta">
                        <span>阶段：${translateStage(pipeline.current_stage)}</span>
                        <span>创建：${new Date(pipeline.created_at).toLocaleTimeString()}</span>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${calculateProgress(pipeline)}%"></div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderPipelineDetail(pipeline) {
            const container = document.getElementById('pipelineDetail');
            
            const stepsHtml = pipeline.steps.map((step, index) => `
                <div class="timeline-item ${getStepClass(step)}">
                    <div class="timeline-dot"></div>
                    <div class="timeline-content">
                        <div class="timeline-title">${step.name}</div>
                        <div class="timeline-time">
                            ${step.started_at ? new Date(step.started_at).toLocaleString() : '未开始'}
                        </div>
                        ${step.logs.length > 0 ? `
                            <div style="margin-top: 0.5rem; font-size: 0.8rem; color: var(--text-secondary);">
                                ${step.logs.slice(-2).map(log => `<div>${log}</div>`).join('')}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');

            container.innerHTML = `
                <div style="margin-bottom: 1.5rem;">
                    <h3 style="margin-bottom: 0.5rem;">${pipeline.name}</h3>
                    <div class="pipeline-status status-${pipeline.status}" style="display: inline-block;">
                        ${getStatusText(pipeline.status)}
                    </div>
                </div>
                
                <div class="timeline">
                    ${stepsHtml}
                </div>
                
                ${pipeline.deployment_health ? `
                    <div style="margin-top: 1.5rem;">
                        <button class="btn btn-rollback" onclick="rollbackDeployment()" style="width: 100%;">
                            ↩️ 回滚部署
                        </button>
                    </div>
                ` : ''}
            `;
        }

        function updateHealthMetrics(health) {
            const metrics = document.querySelectorAll('.metric-card');
            metrics[0].querySelector('.metric-value').textContent = health.cpu_usage.toFixed(1) + '%';
            metrics[1].querySelector('.metric-value').textContent = health.memory_usage.toFixed(1) + '%';
            metrics[2].querySelector('.metric-value').textContent = (health.error_rate * 100).toFixed(2) + '%';
            metrics[3].querySelector('.metric-value').textContent = (health.latency_p99 * 1000).toFixed(0);
        }

        // ==================== 辅助函数 ====================
        function selectPipeline(pipelineId) {
            selectedPipelineId = pipelineId;
            renderPipelineList();
            loadPipelineDetail(pipelineId);
        }

        function getStatusText(status) {
            const statusMap = {
                'queued': '排队中',
                'running': '运行中',
                'success': '成功',
                'failed': '失败',
                'aborted': '已中止',
                'pending_approval': '待审批'
            };
            return statusMap[status] || status;
        }

        function translateStage(stage) {
            const stageMap = {
                'requirement_analysis': '需求分析',
                'prd_design': 'PRD 设计',
                'technical_design': '技术方案',
                'api_design': 'API 设计',
                'ai_coding': 'AI 编码',
                'unit_test': '单元测试',
                'integration_test': '集成测试',
                'ci_cd': 'CI/CD',
                'deployment': '部署',
                'ui_acceptance': 'UI 验收',
                'completed': '已完成'
            };
            return stageMap[stage] || stage;
        }

        function calculateProgress(pipeline) {
            const completedSteps = pipeline.steps.filter(s => s.status === 'success').length;
            return Math.round((completedSteps / pipeline.steps.length) * 100);
        }

        function getStepClass(step) {
            if (step.status === 'success') return 'completed';
            if (step.status === 'running') return 'running';
            if (step.status === 'pending_approval') return 'pending';
            return '';
        }

        function showInterventionPanel(message) {
            document.getElementById('interventionPanel').style.display = 'block';
            document.getElementById('interventionMessage').textContent = message;
            currentInterventionStep = 'current_step'; // 简化处理
        }

        function hideInterventionPanel() {
            document.getElementById('interventionPanel').style.display = 'none';
        }

        function addLog(message, type = 'info') {
            const terminal = document.getElementById('logTerminal');
            const timestamp = new Date().toLocaleTimeString();
            const logClass = `log-${type}`;
            
            const logLine = document.createElement('div');
            logLine.className = 'log-line';
            logLine.innerHTML = `
                <span class="log-timestamp">[${timestamp}]</span>
                <span class="${logClass}">${message}</span>
            `;
            
            terminal.appendChild(logLine);
            terminal.scrollTop = terminal.scrollHeight;
            
            // 限制日志条数
            while (terminal.children.length > 50) {
                terminal.removeChild(terminal.firstChild);
            }
        }

        // ==================== 初始化 ====================
        window.addEventListener('DOMContentLoaded', () => {
            connectWebSocket();
            loadPipelines();
            
            // 定时刷新
            setInterval(loadPipelines, 10000);
        });
    </script>
</body>
</html>
